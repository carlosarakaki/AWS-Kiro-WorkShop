[project]
name = "geosalud-prototype-scripts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "black>=24.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
